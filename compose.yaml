services:
  clinical-review-api:
    build:
      context: ..
      dockerfile: apps/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
      - .env
    environment:
      BITHEALTH_DATA_DIR: /srv/apps/data/candidate_package
      QDRANT_URL: http://qdrant:6333
      BITHEALTH_TELEMETRY_PATH: /srv/apps/telemetry/usage.jsonl
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
    volumes:
      - telemetry_storage:/srv/apps/telemetry
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 12
  policy-indexer:
    build:
      context: ..
      dockerfile: apps/Dockerfile
    env_file:
      - .env.example
      - .env
    environment:
      QDRANT_URL: http://qdrant:6333
      POLICY_CHUNKS_PATH: /srv/apps/data/policy_chunks.jsonl
      HF_HOME: /models
    command: ["python", "-m", "backend.policy.indexer"]
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - embedding_model_cache:/models
    restart: "no"
  phoenix:
    image: arizephoenix/phoenix:version-20.16.0
    ports:
      - "6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_storage:/mnt/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  telemetry_storage:
  phoenix_storage:
  embedding_model_cache:
